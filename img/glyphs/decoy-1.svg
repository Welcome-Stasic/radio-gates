<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Авторский древний глиф</title>
  <desc id="desc">Симметричный магический знак: центральный кристалл под восходящей дугой, окружённый парными линиями и без основания.</desc>
  <g stroke="#302117" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- Восходящая дуга и симметричные завитки -->
    <path d="M132 184c12-45 46-77 89-80 16-1 27 6 35 19 8-13 19-20 35-19 43 3 77 35 89 80-22-15-43-17-62-8-18 9-31 23-43 42-6 9-12 18-19 27-7-9-13-18-19-27-12-19-25-33-43-42-19-9-40-7-62 8Z"/>
    <!-- Центральное солнце-кристалл -->
    <path d="M256 123v45"/>
    <path d="m256 168 18 19-18 19-18-19 18-19Z" fill="#c4954d"/>
    <!-- Ореол вокруг внутреннего знака -->
    <path d="M256 218c41 0 69 27 69 61s-28 61-69 61-69-27-69-61 28-61 69-61Z"/>
    <path d="m256 247 23 32-23 32-23-32 23-32Z"/>
    <circle cx="256" cy="279" r="7" fill="#c4954d" stroke="none"/>
  </g>
  <!-- Три точки-печати -->
  <g fill="#c4954d">
    <circle cx="117" cy="238" r="7"/>
    <circle cx="395" cy="238" r="7"/>
