<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Авторский древний глиф</title>
  <desc id="desc">Симметричный магический знак с тремя объединёнными элементами внутри защитного контура.</desc>
  <g stroke="#302117" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- Замкнутый контур — целое, объединяющее внутренние части -->
    <path d="M256 87c-76 0-133 49-133 117 0 33 16 58 40 77-13 29-8 66 14 89 21 21 53 30 84 22 31 8 63-1 84-22 22-23 27-60 14-89 24-19 40-44 40-77 0-68-57-117-133-117Z"/>
    <!-- Три части, сходящиеся в общий центр -->
    <path d="M256 132v79M172 247l65 27M340 247l-65 27"/>
    <circle cx="256" cy="221" r="24"/>
    <circle cx="174" cy="255" r="21"/>
    <circle cx="338" cy="255" r="21"/>
    <!-- Знак соединения в центре -->
    <path d="m256 260 18 18-18 18-18-18 18-18Z" fill="#c4954d"/>
    <!-- Верхняя печать и нижнее основание в стиле первого глифа -->
    <path d="m256 54 17 17-17 17-17-17 17-17Z" fill="#c4954d"/>
    <path d="M256 404v22M208 426h96M225 451h62"/>
  </g>
  <g fill="#c4954d">
    <circle cx="123" cy="204" r="7"/>
    <circle cx="389" cy="204" r="7"/>
    <circle cx="256" cy="478" r="7"/>
  </g>
</svg>
